<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="PromoHub - AI-powered marketplace for buying, selling, and discovering amazing deals." />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PromoHub" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="shortcut icon" type="image/png" href="favicon.png" />

    <title>PromoHub - Marketplace & Deals</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      body {
        background: #0b0f19;
        margin: 0;
        overflow: hidden;
      }

      #loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0b0f19 0%, #1a1e2e 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .logo-wrapper {
        position: relative;
        margin-bottom: 24px;
        animation: pulseLogo 2s ease-in-out infinite;
      }

      .logo-img {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(248, 75, 90, 0.35);
        object-fit: cover;
      }

      .loader {
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top: 3px solid #F84B5A;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        animation: spin 0.8s linear infinite;
      }

      .loading-text {
        margin-top: 16px;
        color: #94A3B8;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(248, 75, 90, 0.4)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(248, 75, 90, 0.7)); }
      }
    </style>
  </head>
  <body>
    <!-- Loader Container with PromoHub Logo -->
    <div id="loading-container">
      <div class="logo-wrapper">
        <img class="logo-img" src="favicon.png" alt="PromoHub Logo" />
      </div>
      <div class="loader"></div>
      <div class="loading-text">Loading PromoHub...</div>
    </div>

    <script src="flutter.js" defer></script>

    <script>
      var scriptLoaded = false;

      function loadMainDartJs() {
        if (scriptLoaded) return;
        scriptLoaded = true;
        var scriptTag = document.createElement("script");
        scriptTag.src = "main.dart.js";
        scriptTag.type = "application/javascript";
        document.body.appendChild(scriptTag);
      }

      function removeLoader() {
        var loader = document.getElementById("loading-container");
        if (loader) {
          loader.style.opacity = "0";
          loader.style.transition = "opacity 0.4s ease-out";
          setTimeout(function() {
            loader.style.display = "none";
          }, 400);
        }
      }

      window.addEventListener("flutter-first-frame", function () {
        removeLoader();
        window.parent.postMessage({ type: "LOADING_COMPLETED" }, "*");
      });

      loadMainDartJs();
    </script>

    <script>
      // Navigation tracking
      (function (history) {
        const pushState = history.pushState;
        const replaceState = history.replaceState;

        function logNavigation(method, url) {
          window.parent.postMessage({ type: "NAVIGATION", method, url }, "*");
        }

        history.pushState = function (state, title, url) {
          logNavigation("pushState", url);
          return pushState.apply(history, arguments);
        };

        history.replaceState = function (state, title, url) {
          logNavigation("replaceState", url);
          return replaceState.apply(history, arguments);
        };

        window.addEventListener("popstate", function (event) {
          logNavigation("popstate", location.href);
        });
      })(window.history);
    </script>
  </body>
</html>
