<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="description" content="PromoHub - AI-powered marketplace for buying, selling, and discovering amazing deals." />

    <!-- PWA & Theme Color -->
    <meta name="theme-color" content="#F84B5A" />
    <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F84B5A" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Web App Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="PromoHub" />

    <!-- iOS Safari Meta Tags & Icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PromoHub" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png" />

    <!-- Windows Tiles -->
    <meta name="msapplication-TileColor" content="#F84B5A" />
    <meta name="msapplication-TileImage" content="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="shortcut icon" type="image/png" href="favicon.png" />

    <title>PromoHub - Marketplace & Deals</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      body {
        background: #0b0f19;
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0b0f19 0%, #1a1e2e 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 99999;
      }

      .logo-wrapper {
        position: relative;
        margin-bottom: 24px;
        animation: pulseLogo 2s ease-in-out infinite;
      }

      .logo-img {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(248, 75, 90, 0.35);
        object-fit: cover;
      }

      .loader {
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top: 3px solid #F84B5A;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        animation: spin 0.8s linear infinite;
      }

      .loading-text {
        margin-top: 16px;
        color: #94A3B8;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(248, 75, 90, 0.4)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(248, 75, 90, 0.7)); }
      }

      /* PWA Install Banner UI */
      #pwa-install-banner {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(150%);
        background: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(248, 75, 90, 0.3);
        border-radius: 16px;
        padding: 12px 18px;
        display: flex;
        align-items: center;
        gap: 14px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(248, 75, 90, 0.2);
        z-index: 10000;
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        max-width: 90vw;
        width: 420px;
        box-sizing: border-box;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      #pwa-install-banner.show {
        transform: translateX(-50%) translateY(0);
      }

      .pwa-banner-icon {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        object-fit: cover;
        box-shadow: 0 4px 12px rgba(248, 75, 90, 0.3);
        flex-shrink: 0;
      }

      .pwa-banner-text {
        flex: 1;
        min-width: 0;
      }

      .pwa-banner-title {
        font-size: 14px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 2px;
      }

      .pwa-banner-desc {
        font-size: 11.5px;
        color: #94a3b8;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .pwa-install-btn {
        background: linear-gradient(135deg, #F84B5A 0%, #E11D48 100%);
        color: #fff;
        border: none;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 12.5px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 4px 12px rgba(248, 75, 90, 0.35);
        flex-shrink: 0;
      }

      .pwa-install-btn:hover {
        transform: scale(1.04);
        box-shadow: 0 6px 16px rgba(248, 75, 90, 0.5);
      }

      .pwa-close-btn {
        background: transparent;
        border: none;
        color: #64748b;
        font-size: 16px;
        cursor: pointer;
        padding: 4px;
        line-height: 1;
        flex-shrink: 0;
      }

      .pwa-close-btn:hover {
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <!-- Loader Container with PromoHub Logo -->
    <div id="loading-container">
      <div class="logo-wrapper">
        <img class="logo-img" src="favicon.png" alt="PromoHub Logo" />
      </div>
      <div class="loader"></div>
      <div class="loading-text">Loading PromoHub...</div>
    </div>

    <!-- Progressive Web App Install Banner -->
    <div id="pwa-install-banner" role="dialog" aria-label="Install PromoHub">
      <img class="pwa-banner-icon" src="icons/Icon-192.png" alt="PromoHub App" />
      <div class="pwa-banner-text">
        <div class="pwa-banner-title">Install PromoHub</div>
        <div class="pwa-banner-desc">Add to home screen for faster shopping</div>
      </div>
      <button id="pwa-install-button" class="pwa-install-btn">Install</button>
      <button id="pwa-dismiss-button" class="pwa-close-btn" aria-label="Dismiss">✕</button>
    </div>

    <script src="flutter.js" defer></script>

    <!-- Progressive Web App Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js')
            .then(function (registration) {
              console.log('[PWA] Service Worker registered with scope:', registration.scope);
            })
            .catch(function (error) {
              console.warn('[PWA] Service Worker registration failed:', error);
            });
        });
      }

      // PWA Install Prompt Logic
      let deferredPrompt = null;
      const installBanner = document.getElementById('pwa-install-banner');
      const installBtn = document.getElementById('pwa-install-button');
      const dismissBtn = document.getElementById('pwa-dismiss-button');

      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent default mini-infobar on mobile Chrome
        e.preventDefault();
        deferredPrompt = e;

        // Check if user previously dismissed today
        const lastDismissed = localStorage.getItem('promohub_pwa_dismissed');
        const now = Date.now();
        if (!lastDismissed || now - parseInt(lastDismissed, 10) > 86400000) {
          // Show banner after app loads
          setTimeout(() => {
            if (installBanner) installBanner.classList.add('show');
          }, 2500);
        }
      });

      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (!deferredPrompt) return;
          installBanner.classList.remove('show');
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log('[PWA] User response to install prompt:', outcome);
          deferredPrompt = null;
        });
      }

      if (dismissBtn) {
        dismissBtn.addEventListener('click', () => {
          if (installBanner) installBanner.classList.remove('show');
          localStorage.setItem('promohub_pwa_dismissed', Date.now().toString());
        });
      }

      window.addEventListener('appinstalled', () => {
        console.log('[PWA] PromoHub installed successfully!');
        if (installBanner) installBanner.classList.remove('show');
        deferredPrompt = null;
      });
    </script>

    <script>
      var scriptLoaded = false;

      function loadMainDartJs() {
        if (scriptLoaded) return;
        scriptLoaded = true;
        var scriptTag = document.createElement("script");
        scriptTag.src = "main.dart.js";
        scriptTag.type = "application/javascript";
        document.body.appendChild(scriptTag);
      }

      function removeLoader() {
        var loader = document.getElementById("loading-container");
        if (loader) {
          loader.style.opacity = "0";
          loader.style.transition = "opacity 0.4s ease-out";
          setTimeout(function() {
            loader.style.display = "none";
          }, 400);
        }
      }

      window.addEventListener("flutter-first-frame", function () {
        removeLoader();
        window.parent.postMessage({ type: "LOADING_COMPLETED" }, "*");
      });

      loadMainDartJs();
    </script>

    <script>
      // Navigation tracking
      (function (history) {
        const pushState = history.pushState;
        const replaceState = history.replaceState;

        function logNavigation(method, url) {
          window.parent.postMessage({ type: "NAVIGATION", method, url }, "*");
        }

        history.pushState = function (state, title, url) {
          logNavigation("pushState", url);
          return pushState.apply(history, arguments);
        };

        history.replaceState = function (state, title, url) {
          logNavigation("replaceState", url);
          return replaceState.apply(history, arguments);
        };

        window.addEventListener("popstate", function (event) {
          logNavigation("popstate", location.href);
        });
      })(window.history);
    </script>
  </body>
</html>
